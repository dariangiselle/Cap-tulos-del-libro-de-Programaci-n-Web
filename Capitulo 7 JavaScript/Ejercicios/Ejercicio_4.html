        <script type="text/javascript">
            document.writeln("<h1>Ejercicio 7.4</h1>");
            document.writeln("<p>Escriba una instrucción en JavaScript para realizar cada una de las siguientes tareas:</p>");

            document.writeln("<p><b>a)</b> Declarar las variables suma y x.</p>");
            document.writeln("<p>var suma, x;</p>");

            document.writeln("<p><b>b)</b> Asignar 1 a la variable x.</p>");
            document.writeln("<p>x = 1;</p>");

            document.writeln("<p><b>c)</b> Asignar 0 a la variable suma.</p>");
            document.writeln("<p>suma = 0;</p>");

            document.writeln("<p><b>d)</b> Sumar la variable x a suma y asignar el resultado a la variable suma.</p>");
            document.writeln("<p>suma = suma + x;</p>");

            document.writeln("<p><b>e)</b> Imprimir \"La suma es: \", seguido del valor de la variable suma.</p>");
            document.writeln("<p>document.writeln(\"La suma es: \" + suma);</p>");
        </script>
