<!DOCTYPE html>
<!-- Documento de HTML5 que muestra imágenes seleccionadas al azar. -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Generador de im&aacute;genes al azar</title>
        <script src = "js/ImagenAleatoria.js"></script>
        
        <style type="text/css">
            #imagen {
                width: 350px;       /* Cambia este valor a los pixeles que prefieras (ej. 300px, 400px) */
                height: auto;       /* Mantiene la proporción original para que no se deforme */
                cursor: pointer;    /* Hace que el cursor cambie a "manita" cuando pases el mouse por encima */
                display: block;     
                margin-bottom: 20px;
            }
            
            nav {
                background-color: lightblue;
                padding: 10px;
                text-align: center;
                border: 2px solid navy;
            }

            nav a {
                color: navy;
                text-decoration: none;
                font-weight: bold;
                margin: 10px;
            }

            nav a:hover {
                color: red;
                text-decoration: underline;
            }
        </style>

    </head>

    <body>
        
        <img id = "imagen" src = "imagenes/ECP.png" alt = "Error com&uacute;n de programaci&oacute;n">

        <script type="text/javascript">
            document.writeln(
                '<nav>' +
                '<a href="Ejemplo_4.html">← Anterior</a> | ' +

                '<a href="Ejemplo_6.html">Siguiente →</a>' +
                '</nav>' +
                '<hr>'
            );
        </script>

    </body>
</html>
