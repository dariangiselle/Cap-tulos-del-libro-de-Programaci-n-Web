<!DOCTYPE html>
<!-- Elementos de inclinación y de transformación en CSS3. -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Inclinar (skew)</title>
        <style type="text/css">
            .skew .textbox
            {
                margin-left: 75px;
                background: lightgreen;
                height: 100px;
                width: 200px;
                padding: 25px 0;
                text-align: center;
                font-size: 250%;
                border: 3px solid darkgreen;
                border-radius: 15px;
                -webkit-animation: skew 3s infinite linear;
                -moz-animation: skew 3s infinite linear;
                animation: skew 3s infinite linear;
            }
            @-webkit-keyframes skew
            {
                from { -webkit-transform: skewX(0deg); }
                25% { -webkit-transform: skewX(45deg); }
                50% { -webkit-transform: skewX(0); }
                75% { -webkit-transform: skewX(-45deg); }
                to { -webkit-transform: skewX(0); }
            }
            @-moz-keyframes skew
            {
                from { -webkit-transform: skewX(0deg); }
                25% { -webkit-transform: skewX(45deg); }
                50% { -webkit-transform: skewX(0); }
                75% { -webkit-transform: skewX(-45deg); }
                to { -webkit-transform: skewX(0); }
            }
            @keyframes skew
            {
                from { -webkit-transform: skewX(0deg); }
                25% { -webkit-transform: skewX(45deg); }
                50% { -webkit-transform: skewX(0); }
                75% { -webkit-transform: skewX(-45deg); }
                to { -webkit-transform: skewX(0); }
            }
            nav {
                background-color: lightblue;
                padding: 10px;
                text-align: center;
                border: 2px solid navy;
            }

            nav a {
                color: navy;
                text-decoration: none;
                font-weight: bold;
                margin: 10px;
            }

            nav a:hover {
                color: red;
                text-decoration: underline;
            }
        </style>
    </head>

    <body>
        <nav>
        <a href="Ejemplo_11.html">← Anterior</a> | 
        <a href="../index_cap5.html">Menú del Capítulo 5</a> | 
        <a href="Ejemplo_13.html">Siguiente →</a>
        </nav>
        <hr>

        <h3>Ejemplo 5.12</h3>
        
        <div class="box skew">
        <div class="textbox">Inclinar texto</div>
        </div>
    </body>
</html>
