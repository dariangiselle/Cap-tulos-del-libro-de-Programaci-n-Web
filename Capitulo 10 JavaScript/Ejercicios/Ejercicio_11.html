        <script type="text/javascript">
            document.writeln( "<h1>Ejercicio 10.11</h1>" );
            document.writeln( "<p style=\"color: #2c3e50;\"><b>Escriba instrucciones que realicen las siguientes operaciones para un arreglo unidimensional:</b></p>" );

            // Inciso a
            document.writeln( "<p><b>a) Establecer los 10 elementos del arreglo cuentas en ceros.</b><br>" );
            document.writeln( "<code>for ( var i = 0; i &lt; cuentas.length; ++i ) {<br>&nbsp;&nbsp;&nbsp;&nbsp;cuentas[ i ] = 0;<br>}</code></p>" );

            // Inciso b
            document.writeln( "<p><b>b) Sumar 1 a cada uno de los 15 elementos del arreglo bono.</b><br>" );
            document.writeln( "<code>for ( var i = 0; i &lt; bono.length; ++i ) {<br>&nbsp;&nbsp;&nbsp;&nbsp;bono[ i ] += 1;<br>}</code></p>" );

            // Inciso c
            document.writeln( "<p><b>c) Mostrar los cinco valores del arreglo mejoresPuntuaciones, separado por espacios.</b><br>" );
            document.writeln( "<code>for ( var i = 0; i &lt; 5; ++i ) {<br>&nbsp;&nbsp;&nbsp;&nbsp;document.writeln( mejoresPuntuaciones[ i ] + \" \" );<br>}</code></p>" );
        </script>
