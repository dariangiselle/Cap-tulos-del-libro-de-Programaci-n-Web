<!DOCTYPE html>
<!-- Ejercicio 7. 13 -->
<html>
    <head>
        <meta charset="utf-8">
        <title>7. 13</title>

        <script type="text/javascript">
            var ventas;
            var ventasTotales = 0;
            var ingresos;
            var contador = 1;

            while ( contador <= 4 )
            {
                ventas = parseFloat(prompt(
                    "Introduzca el valor del artículo " + contador + ":"
                ));

                ventasTotales += ventas;

                ++contador;
            }

            ingresos = 200 + ventasTotales * 0.09;

            document.writeln("<h1>Ingresos del vendedor</h1>");
            document.writeln(
                "<p>Ventas totales: $" +
                ventasTotales.toFixed(2) + "</p>"
            );
            document.writeln(
                "<p>Ingresos semanales: $" +
                ingresos.toFixed(2) + "</p>"
            );
        </script>
