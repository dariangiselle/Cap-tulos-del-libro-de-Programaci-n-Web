<!DOCTYPE html>
<!-- Uso de estilos en línea -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Estilos en l&iacute;nea</title>
    </head>
    <body>
        <nav>
        <a href="Ejemplo_13.html">← Anterior</a> | 
        <a href="../index_cap4.html">Menú del Capítulo 3</a> | 
        <a href="Ejemplo_2.html">Siguiente →</a>
        </nav>
        <hr>
        
        <p>Este texto no tiene aplicado ning&uacute;n estilo.</p>

        <!-- El atributo style nos permite declarar estilos en línea. Debemos separar varias propiedades de style con un punto y coma. -->
        <p style="font-size: 20pt;">Este texto tiene aplicado el estilo
            <em>font-size</em>, para que sea de 20pt.
        </p>

        <p style="font-size: 20pt; color: deepskyblue;">
            Este texto tiene aplicados los estilos <em>font-size</em> y
            <em>color</em>, para que sea de 
            20pt y de color azul cielo profundo.
        </p>
    </body>
</html>
