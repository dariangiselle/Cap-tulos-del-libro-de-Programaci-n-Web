<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <title>6.22 </title>

        <script>
            var numero1;
            var numero2;

            numero1 = parseInt( window.prompt( "Escribe el primer número entero: " ) );
            numero2 = parseInt( window.prompt( "Escribe el segundo número entero: " ) );

            if ( numero2 == 0 )
                document.writeln( "<h1>El segundo número no puede ser cero</h1>" );
            else if ( numero1 % numero2 == 0 )
                document.writeln( "<h1>" + numero1 + " es múltiplo de " + numero2 + "</h1>" );
            else
                document.writeln( "<h1>" + numero1 + " no es múltiplo de " + numero2 + "</h1>" );

        </script>
