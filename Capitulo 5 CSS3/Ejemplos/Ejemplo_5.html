<!DOCTYPE html>
<!-- Gradientes radiales en CSS3. -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Gradiente radial</title>
        <style type="text/css">
            div
            {
                width: 200px;
                height: 200px;
                padding: 5px;
                text-align: center;
                background: -webkit-radial-gradient(center, yellow, red);
                background: -moz-radial-gradient(center, yellow, red);
                background: radial-gradient(center, yellow, red);
            }
            nav {
                background-color: lightblue;
                padding: 10px;
                text-align: center;
                border: 2px solid navy;
            }

            nav a {
                color: navy;
                text-decoration: none;
                font-weight: bold;
                margin: 10px;
            }

            nav a:hover {
                color: red;
                text-decoration: underline;
            }
        </style>
    </head>
