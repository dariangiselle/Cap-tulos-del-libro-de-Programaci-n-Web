    <head>
        <meta charset="utf-8">
        <title></title>
        
        <script>
            var producto = 1;
            var i;

            for ( i = 1; i <= 15; i += 2 )
            {
                producto *= i;
            }

            document.writeln( "<h1>Producto de los enteros impares</h1>" );
            document.writeln( "<p>El producto de los números impares del 1 al 15 es: <strong>" + producto + "</strong></p>" );
        </script>

                font-weight: bold;
                margin: 10px;
            }

            nav a:hover {
                color: red;
                text-decoration: underline;
