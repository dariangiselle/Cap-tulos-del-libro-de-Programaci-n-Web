        <meta charset="utf-8">
        <title>7. 5</title>

        <script type="text/javascript">
            var suma, x;

            suma = 0;
            x = 1;

            while ( x <= 10 )
            {
                suma = suma + x;
                x++;
            }

            document.writeln("<h1>Ejercicio 7.5</h1>");
            document.writeln("<p>La suma de los enteros del 1 al 10 es: " + suma + "</p>");
        </script>
