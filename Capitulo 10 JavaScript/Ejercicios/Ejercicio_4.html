        <script type="text/javascript">
            document.writeln( "<h1>Ejercicio 10.4</h1>" );
            document.writeln( "<p><b>Escribir instrucciones de JavaScript (con respecto al arreglo tabla) para realizar cada una de las siguientes tareas:</b></p>" );

            // Inciso a
            document.writeln( "<p><b>a) Declarar y crear el arreglo con tres filas y tres columnas.</b><br>" );
            document.writeln( "<code>var tabla = [ [ 0, 0, 0 ], [ 0, 0, 0 ], [ 0, 0, 0 ] ];</code></p>" );

            // Inciso b
            document.writeln( "<p><b>b) Almacenar el número total de elementos en la variable totalElementos.</b><br>" );
            document.writeln( "<code>var totalElementos = 9;</code> (o mediante <code>tabla.length * tabla[ 0 ].length</code>)</p>" );

            // Inciso c
            document.writeln( "<p><b>c) Usar una instrucción for...in para inicializar cada elemento del arreglo con la suma de sus índices de fila y de columna. Suponga que las variables x y y se declaran como variables de control.</b><br>" );
            document.writeln( "<code>for ( var x in tabla )<br>{<br>&nbsp;&nbsp;&nbsp;&nbsp;for ( var y in tabla[ x ] )<br>&nbsp;&nbsp;&nbsp;&nbsp;{<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;tabla[ x ][ y ] = parseInt( x ) + parseInt( y );<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>}</code></p>" );
        </script>
