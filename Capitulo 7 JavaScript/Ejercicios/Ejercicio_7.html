        <script type="text/javascript">
            document.writeln("<h1>Ejercicio 7.7</h1>");

            document.writeln("<p><b>Pregunta:</b> Identifique y corrija los errores en cada uno de los siguientes segmentos de código:</p>");

            document.writeln("<h3>a)</h3>");
            document.writeln("<pre>while ( c <= 5 ) {\n    producto *= c;\n    ++c;</pre>");

            document.writeln("<p><b>Respuesta:</b> Error: falta la llave derecha de cierre del cuerpo de la instrucción while.</p>");
            document.writeln("<p><b>Corrección:</b> Agregar una llave derecha de cierre después de la instrucción ++c;</p>");

            document.writeln("<h3>b)</h3>");
            document.writeln("<pre>if ( genero == 1 )\n    document.writeln(\"Mujer\");\nelse ;\n    document.writeln(\"Hombre\");</pre>");

            document.writeln("<p><b>Respuesta:</b> Error: el ; después de else produce un error lógico. La segunda instrucción de salida siempre se ejecutará.</p>");
            document.writeln("<p><b>Corrección:</b> Quitar el punto y coma después de else.</p>");
        </script>
