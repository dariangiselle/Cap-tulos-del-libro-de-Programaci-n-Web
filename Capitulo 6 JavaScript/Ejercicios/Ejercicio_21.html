        <meta charset="utf-8">
        <title>6.21 </title>

        <script type="text/javascript">

            var numero;

            // Lee un número entero del usuario
            numero = window.prompt("Escriba un número entero");

            // Convierte la cadena a un número entero
            numero = parseInt(numero);

            // Determina si el número es par o impar
            if (numero % 2 == 0)
                document.writeln("<h1>El número es par</h1>");

            if (numero % 2 != 0)
                document.writeln("<h1>El número es impar</h1>");

        </script>
