        <script type="text/javascript">
            document.writeln("<p><strong>a)</strong> ¿Qué operaciones aritméticas tienen la misma precedencia que la multiplicación?</p>");
            document.writeln("<p>Respuesta: La división (/) y el módulo (%).</p>");

            document.writeln("<p><strong>b)</strong> Cuando hay paréntesis anidados, ¿cuáles se evalúan primero?</p>");
            document.writeln("<p>Respuesta: Los paréntesis más internos.</p>");

            document.writeln("<p><strong>c)</strong> Una ubicación en la memoria de la computadora que puede contener distintos valores durante la ejecución de una secuencia de comandos se llama:</p>");
