<!DOCTYPE html>
<!-- Ejercicio 6.19 -->
<html>
    <head>
        <meta charset="utf-8">
        <title>6.19 </title>

        <script type="text/javascript">

            var radio;
            var pi = 3.14159;
            var diametro;
            var circunferencia;
            var area;

            // Lee el radio del usuario
            radio = window.prompt("Escriba el radio del círculo");

            // Convierte la cadena a un número
            radio = parseFloat(radio);

            // Calcula el diámetro, la circunferencia y el área
            diametro = 2 * radio;
            circunferencia = 2 * pi * radio;
            area = pi * radio * radio;

            // Muestra los resultados
            document.writeln("<h1>Resultados del círculo</h1>");
            document.writeln("<p>Radio: " + radio + "</p>");
            document.writeln("<p>Diámetro: " + diametro + "</p>");
            document.writeln("<p>Circunferencia: " +
                circunferencia + "</p>");
            document.writeln("<p>Área: " + area + "</p>");

        </script>
