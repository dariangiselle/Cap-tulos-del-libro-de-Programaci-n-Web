<!DOCTYPE html>
<!-- Ejercicio 7. 20 -->
<html>
    <head>
        <meta charset="utf-8">
        <title>7. 20</title>
        
        <script>

            var entrada;
            var numero;
            var esValido = false;

            while ( !esValido )
            {
                entrada = window.prompt( "Escriba un número entero de cinco dígitos:", "0" );
                
                numero = parseInt( entrada );

                if ( ( numero >= 10000 && numero <= 99999 ) || ( numero <= -10000 && numero >= -99999 ) )
                {
                    esValido = true;
                }
                else
                {
                    window.alert( "Error: El número debe ser estrictamente de cinco dígitos. Intente de nuevo." );
                }
            } 
            if ( numero < 0 )
            {
                numero = -numero;
            }

            var digito1 = Math.floor( numero / 10000 );        
            var digito2 = Math.floor( numero / 1000 ) % 10;     
            var digito4 = Math.floor( numero / 10 ) % 10;       
            var digito5 = numero % 10;                          

            document.writeln( "<h1>Resultado del análisis</h1>" );
            document.writeln( "<p>Número analizado: <strong>" + numero + "</strong></p>" );

            if ( digito1 == digito5 && digito2 == digito4 )
            {
                document.writeln( "<p><strong>¡El número es un palíndromo!</strong></p>" );
            }
            else
            {
                document.writeln( "<p><strong>El número NO es un palíndromo.</strong></p>" );
            }

        </script>
