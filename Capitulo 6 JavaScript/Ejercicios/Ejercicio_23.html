        <title>6.23 </title>

        <script>
            var numero1;
            var numero2;
            var numero3;
            var positivos = 0;
            var negativos = 0;
            var ceros = 0;

            numero1 = parseInt( window.prompt( "Escribe el primer número entero: "));
            numero2 = parseInt( window.prompt( "Escribe el segundo número entero: "));
            numero3 = parseInt( window.prompt( "Escribe el tercer número entero: "));

            if ( numero1 > 0)
                positivos = positivos + 1;
            else if (numero1 < 0)
                negativos = negativos + 1;
            else 
                ceros = ceros + 1;

            if ( numero2 > 0)
                positivos = positivos + 1;
            else if (numero2 < 0)
                negativos = negativos + 1;
            else 
                ceros = ceros + 1;

            if ( numero3 > 0)
                positivos = positivos + 1;
            else if (numero3 < 0)
                negativos = negativos + 1;
            else 
                ceros = ceros + 1;

            document.writeln( "<p>Números positivos introducidos: " + positivos + "</p>" );
            document.writeln( "<p>Números negativos introducidos: " + negativos + "</p>" );
            document.writeln( " Números cero introducidos: " + ceros + "</p>" );

        </script>
