        <h1>Ejercicio 6.11</h1>
        <h2>Diálogos de alerta</h2>

        <script type="text/javascript">
            var x = 2;
            var y = 3;

            window.alert("x = " + x);

            window.alert("El valor de x + x es " + (x + x));

            window.alert("x =");

            window.alert(x + y + " = " + (y + x));
        </script>
