<!DOCTYPE html>
<!-- Ejercicio 7. 15 -->
<html>
    <head>
        <meta charset="utf-8">
        <title>7. 15</title>

        <script>

            var contador = 1;
            var numero;
            var mayor = 0;

            while ( contador <= 10 )
            {
                numero = window.prompt(
                    "Escriba un número entero de un solo dígito:", "0" );

                numero = parseInt( numero );

                if ( numero > mayor )
                    mayor = numero;

                contador = contador + 1;
            }

            document.writeln(
                "<h1>El número más grande es " + mayor + "</h1>" );

        </script>

            nav {

                color: red;
                text-decoration: underline;
