<html>
    <head>
        <meta charset="utf-8">
        <title>5.6 Sombra de texto</title>
        <style type="text/css">
            div
            {
                background-color: pink;
                width: 200px;
                height: 200px;
                box-shadow: 15px 15px 20px dimgrey;
            }
            .div2
            {
                background-color: plum;
                width: 200px;
                height: 200px;
                box-shadow: -15px -15px 30px dimgrey;
            }
            .div3
            {
                background-color: cornflowerblue;
                width: 200px;
                height: 200px;
                box-shadow: 15px 15px 10px dimgrey;
            }
            nav {
                background-color: lightblue;
                padding: 10px;
                text-align: center;
                border: 2px solid navy;
            }

            nav a {
                color: navy;
                text-decoration: none;
                font-weight: bold;
                margin: 10px;
            }

            nav a:hover {
                color: red;
                text-decoration: underline;
            }
        </style>
    </head>

        <h4>5.6 Sombra de texto</h4>
        <div>
            <strong>box-shadow: 15px 15px 20px</strong>
        </div>

        <div class="div2">
            <strong>box-shadow: -15px -15px 30px</strong>
        </div>

        <div class="div3">
            <strong>box-shadow: 15px 15px 10px</strong>
        </div>

    </body>
</html>
