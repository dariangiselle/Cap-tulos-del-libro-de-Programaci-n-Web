        <script type="text/javascript">
            document.writeln("<h1>Ejercicio 7.3</h1>");
            document.writeln("<p>Escriba instrucciones en JavaScript para realizar cada una de las siguientes tareas:</p>");

            document.writeln("<p><b>a)</b> Asignar la suma de x y y a z, e incrementar el valor de x en 1 después del cálculo. Usar sólo una instrucción.</p>");
            document.writeln("<p><b>Respuesta:</b> z = x++ + y;</p>");

            document.writeln("<p><b>b)</b> Evaluar si el valor de la variable cuenta es mayor que 10. De ser así, imprimir \"Cuenta es mayor que 10\".</p>");
            document.writeln("<p><b>Respuesta:</b> if (cuenta > 10) document.writeln(\"Cuenta es mayor que 10\");</p>");

            document.writeln("<p><b>c)</b> Decrementar la variable x en 1, luego restarla a la variable total. Usar sólo una instrucción.</p>");
            document.writeln("<p><b>Respuesta:</b> total -= --x;</p>");

            document.writeln("<p><b>d)</b> Calcular el residuo después de dividir q entre divisor y asignar el resultado a q. Escriba esta instrucción de dos maneras distintas.</p>");
            document.writeln("<p><b>Respuesta 1:</b> q = q % divisor;</p>");
            document.writeln("<p><b>Respuesta 2:</b> q %= divisor;</p>");
        </script>
