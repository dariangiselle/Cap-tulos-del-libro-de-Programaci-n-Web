        <title>Ejercicio 10.6</title>
        
        <script type="text/javascript">
            document.writeln( "<h1>Ejercicio 10.6</h1>" );
            document.writeln( "<p style=\"color: #2c3e50;\"><b>Complete las siguientes oraciones:</b></p>" );

            // Inciso a
            document.writeln( "<p><b>a)</b> JavaScript almacena listas de valores en <strong style=\"color: #2980b9;\">arreglos</strong>.</p>" );

            // Inciso b
            document.writeln( "<p><b>b)</b> Los nombres de los cuatro elementos del arreglo p son <strong style=\"color: #e74c3c;\">p[ 0 ]</strong>, <strong style=\"color: #e74c3c;\">p[ 1 ]</strong>, <strong style=\"color: #e74c3c;\">p[ 2 ]</strong> y <strong style=\"color: #e74c3c;\">p[ 3 ]</strong>.</p>" );

            // Inciso c
            document.writeln( "<p><b>c)</b> En un arreglo bidimensional, por convención el primer índice identifica el <strong style=\"color: #27ae60;\">renglón (o fila)</strong> de un elemento y el segundo índice identifica la <strong style=\"color: #27ae60;\">columna</strong> de un elemento.</p>" );

            // Inciso d
            document.writeln( "<p><b>d)</b> Un arreglo de <i>m</i> por <i>n</i> contiene <strong style=\"color: #8e44ad;\"><i>m</i></strong> filas, <strong style=\"color: #8e44ad;\"><i>n</i></strong> columnas y <strong style=\"color: #8e44ad;\"><i>m * n</i></strong> elementos.</p>" );

            // Inciso e
            document.writeln( "<p><b>e)</b> El nombre de un elemento en la fila 3 y la columna 5 del arreglo d es <strong style=\"color: #d35400;\">d[ 3 ][ 5 ]</strong>.</p>" );
        </script>
