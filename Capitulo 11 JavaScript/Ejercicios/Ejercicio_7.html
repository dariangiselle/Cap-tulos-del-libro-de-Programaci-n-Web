<!DOCTYPE html>
<!-- Ejercicio 11.7 -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Ejercicio 11.7</title>
        <script>
            // Ejercicio 11.7: enunciados al azar con cuatro arreglos de cadenas
            var articulo = [ "el", "un", "algún", "ningún" ];
            var sustantivo = [ "niño", "niña", "perro", "ciudad", "auto" ];
            var verbo = [ "manejó", "saltó", "corrió", "caminó", "omitió" ];
            var preposicion = [ "a", "desde", "encima de", "debajo de", "sobre" ];

            // elige un elemento al azar de un arreglo
            function aleatorio( arreglo )
            {
                return arreglo[ Math.floor( Math.random() * arreglo.length ) ];
            }

            // articulo sustantivo verbo preposicion articulo sustantivo
            function crearEnunciado()
            {
                var enunciado = aleatorio( articulo );
                enunciado += " " + aleatorio( sustantivo );
                enunciado += " " + aleatorio( verbo );
                enunciado += " " + aleatorio( preposicion );
                enunciado += " " + aleatorio( articulo );
                enunciado += " " + aleatorio( sustantivo );

                // empieza con mayúscula y termina con punto
                return enunciado.charAt( 0 ).toUpperCase() + enunciado.substring( 1 ) + ".";
            }

            function crearHistoria()
            {
                var historia = "Había una vez...\n";
                for ( var i = 1; i <= 20; ++i )
                {
                    historia += crearEnunciado() + "\n";
                }
                historia += "FIN";
                document.getElementById( "historia" ).value = historia;
            }

            function iniciar()
            {
                document.getElementById( "botonHistoria" ).addEventListener( "click", crearHistoria, false );
                crearHistoria();
            }

            window.addEventListener( "load", iniciar, false );
        </script>

        <style type="text/css">
            body {
                font-family: Arial, sans-serif;
                color: #333;
                margin: 20px;
            }
            h2 {
                color: #2c3e50;
            }
            textarea { 
                font-family: monospace; 
            }
            nav {
                background-color: lightblue;
                padding: 10px;
                text-align: center;
                border: 2px solid navy;
            }
            nav a {
                color: navy;
                text-decoration: none;
                font-weight: bold;
                margin: 10px;
            }
            nav a:hover {
                color: red;
                text-decoration: underline;
            }
        </style>
    </head>

    <body>
        <h2>Generador de historias al azar</h2>
        <p>
            Cada enunciado se forma con una palabra al azar de los arreglos <b>articulo</b>, <b>sustantivo</b>,
            <b>verbo</b>, <b>preposicion</b>, <b>articulo</b> y <b>sustantivo</b>, en ese orden.
            La historia tiene 20 enunciados.
        </p>
        <p><input id="botonHistoria" type="button" value="Generar otra historia"></p>
        <textarea id="historia" rows="24" cols="50" readonly></textarea>
        <hr>

        <script type="text/javascript">
            document.writeln(
                '<nav>' +
                '<a href="Ejercicio_6.html">← Anterior</a> | ' +
                '<a href="../index_cap11.html">Menú del Capítulo 11</a> | ' +
                '<a href="Ejercicio_8.html">Siguiente →</a>' +
                '</nav>' +
                '<hr>'
            );
        </script>
    </body>
</html>
