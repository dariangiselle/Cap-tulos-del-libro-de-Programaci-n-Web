        <script type="text/javascript">
            document.writeln( "<h1>Ejercicio 10.1</h1>" );
            document.writeln( "<p style=\"color: #2c3e50;\"><b>Complete las siguientes oraciones:</b></p>" );

            document.writeln( "<p><b>a)</b> Es posible almacenar listas y tablas de valores en <strong style=\"color: #2980b9;\">arreglos</strong>.</p>" );
            document.writeln( "<p><b>b)</b> El número que se utiliza para referirse a un elemento específico de un arreglo se conoce como su <strong style=\"color: #e74c3c;\">índice</strong> (o subíndice).</p>" );
            document.writeln( "<p><b>c)</b> El proceso de poner en orden los elementos de un arreglo se conoce como <strong style=\"color: #27ae60;\">ordenar</strong> el arreglo.</p>" );
            document.writeln( "<p><b>d)</b> Al proceso de determinar si un arreglo contiene cierto valor clave se le conoce como <strong style=\"color: #8e44ad;\">búsqueda</strong> en el arreglo.</p>" );
            document.writeln( "<p><b>e)</b> Un arreglo que utiliza dos índices se conoce como arreglo <strong style=\"color: #d35400;\">bidimensional</strong> (o matricial).</p>" );
        </script>
