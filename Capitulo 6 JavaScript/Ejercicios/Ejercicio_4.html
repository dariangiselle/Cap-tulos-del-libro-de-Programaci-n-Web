        <h1>Ejercicio 6.4</h1>
        <h2>Errores y correcciones en JavaScript</h2>

        <script type="text/javascript">
            document.writeln("<h3>Inciso a)</h3>");
            document.writeln("<p><strong>Error:</strong> Hay un punto y coma después del paréntesis derecho de la condición del if.</p>");
            document.writeln("<p><strong>Corrección:</strong> Eliminar el punto y coma después del paréntesis derecho.</p>");
            document.writeln("<p><strong>Explicación:</strong> El punto y coma se interpreta como una instrucción vacía y la instrucción de salida se ejecuta sin importar si la condición es verdadera o falsa.</p>");

            document.writeln("<h3>Inciso b)</h3>");
            document.writeln("<p><strong>Error:</strong> El operador relacional =&gt; es incorrecto.</p>");
            document.writeln("<p><strong>Corrección:</strong> Cambiar =&gt; por &gt;=.</p>");
            document.writeln("<p><strong>Explicación:</strong> El operador &gt;= significa mayor o igual que.</p>");
        </script>
