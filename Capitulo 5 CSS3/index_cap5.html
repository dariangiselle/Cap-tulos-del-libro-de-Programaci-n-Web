<!DOCTYPE html>
<!-- Capítulo 5 -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Cap&iacute;tulo 5. CSS3</title>

        <style type="text/css">

            body {
                background-color: honeydew;
                font-family: Arial;
                text-align: center;
            }

            h1 {
                color: darkgreen;
                text-shadow: 2px 2px 3px gray;
            }

            ul {
                width: 300px;
                margin: auto;
                list-style-type: none;
            }

            li {
                background-color: #d9f2d9;
                margin: 15px;
                padding: 15px;
                border: 3px solid seagreen;
                border-radius: 10px;
                box-shadow: 3px 3px 6px gray;
            }

            li a {
                color: darkgreen;
                text-decoration: none;
                font-size: 20px;
                font-weight: bold;
            }

            li:hover {
                background-color: #a8d5a2;
            }

            nav {
                background-color: lightblue;
                padding: 10px;
                text-align: center;
                border: 2px solid seagreen;
            }

            nav a {
                color: brown;
                text-decoration: none;
                font-weight: bold;
                margin: 10px;
            }

            nav a:hover {
                color: goldenrod;
                text-decoration: underline;
            }
        </style>
    </head>
