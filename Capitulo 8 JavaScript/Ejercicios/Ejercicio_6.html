<!DOCTYPE html>
<!--  -->
<html>
    <head>
        <meta charset="utf-8">
        <title></title>

        <script>
            var totalValores;
            var entrada;
            var contador = 1;
            var numero;
            var menor = 0;

            // Pedir cuántos valores se introducirán
            entrada = window.prompt( "Escriba el número total de valores a introducir:", "0" );
            totalValores = parseInt( entrada );

            if ( totalValores > 0 )
            {
                while ( contador <= totalValores )
                {
                    entrada = window.prompt( "Escriba el número (" + contador + " de " + totalValores + "):", "0" );
                    numero = parseInt( entrada );

                    // Si es el primer número, se asume como el menor inicial
                    if ( contador == 1 )
                    {
                        menor = numero;
                    }
                    else if ( numero < menor )
                    {
                        menor = numero;
                    }

                    ++contador;
                } // fin de while

                document.writeln( "<h1>Resultado</h1>" );
                document.writeln( "<p>El número menor es: <strong>" + menor + "</strong></p>" );
            }
            else
            {
                document.writeln( "<p>Número de valores inválido.</p>" );
            }
        </script>
        
        <style type="text/css">
            nav {
                background-color: lightblue;
                padding: 10px;
                text-align: center;
                border: 2px solid navy;
            }

            nav a {
                color: navy;
                text-decoration: none;
                font-weight: bold;
                margin: 10px;
            }

            nav a:hover {
                color: red;
                text-decoration: underline;
            }
        </style>

    </head>

    <body>
        <script type="text/javascript">
            document.writeln(
                '<nav>' +
                '<a href="Ejercicio_5.html">← Anterior</a> | ' +
                '<a href="../index_cap8.html">Menú del Capítulo 8</a> | ' +
                '<a href="Ejercicio_7.html">Siguiente →</a>' +
                '</nav>' +
                '<hr>'
            );
        </script>
    </body>
</html>
