        <script type="text/javascript">
            document.writeln("<h1>Ejercicio 7.6</h1>");

            document.writeln("<p><b>Instrucción:</b> Determine el valor de cada variable después de realizar el cálculo. Suponga que, cuando se empieza a ejecutar cada instrucción, todas las variables tienen el valor entero 5.</p>");

            document.writeln("<p><b>a)</b> producto *= x++;</p>");
            document.writeln("<p><b>Respuesta:</b> producto = 25, x = 6;</p>");

            document.writeln("<p><b>b)</b> cociente /= ++x;</p>");
            document.writeln("<p><b>Respuesta:</b> cociente = 0.833333..., x = 6;</p>");
        </script>
