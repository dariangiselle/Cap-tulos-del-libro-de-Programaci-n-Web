        <meta charset="utf-8">
        <title>7. 21</title>
        
        <script>

            var numero = 2; 

            document.writeln( "<h1>Generador de múltiplos de 2 (Ciclo Infinito)</h1>" );
            document.writeln( "<p>A continuación se muestran las potencias de 2:</p>" );

            while ( numero > 0 )
            {
                document.writeln( numero + " " );
                
                numero = numero * 2;
            } 

        </script>
