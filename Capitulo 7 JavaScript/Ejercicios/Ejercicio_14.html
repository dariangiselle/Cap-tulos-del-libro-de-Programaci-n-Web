<!DOCTYPE html>
<!-- Ejercicio 7. 14 -->
<html>
    <head>
        <meta charset="utf-8">
        <title>7. 14</title>

        <script type="text/javascript">
            var nombre;
            var horas;
            var tarifa;
            var sueldo;
            var contador = 1;

            document.writeln("<h1>Sueldos brutos de los empleados</h1>");

            while ( contador <= 3 )
            {
                nombre = prompt("Introduzca el nombre del empleado:");

                horas = parseInt(prompt("Introduzca las horas trabajadas:"));

                tarifa = parseFloat(prompt("Introduzca la tarifa por hora:"));

                if ( horas <= 40 )
                {
                    sueldo = horas * tarifa;
                }
                else
                {
                    sueldo = 40 * tarifa + (horas - 40) * tarifa * 1.5;
                }

                document.writeln("<p>Empleado: " + nombre + "</p>");
                document.writeln("<p>Sueldo bruto: $" + sueldo.toFixed(2) + "</p>");

                ++contador;
            }
        </script>
