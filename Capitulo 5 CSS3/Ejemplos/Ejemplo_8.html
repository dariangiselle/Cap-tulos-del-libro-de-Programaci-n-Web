<!DOCTYPE html>
<!-- Reflejos en CSS3. -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Reflejos en CSS3</title>
        <style type="text/css">
            img { margin-right: 30px; }
            img.below
            {
                -webkit-box-reflect: below 5px
                    -webkit-gradient(
                        linear, left top, left bottom,
                        from(transparent), to(white));
            }
            img.right
            {
                -webkit-box-reflect: right 5px
                    -webkit-gradient(
                        linear, right top, left top,
                        from(transparent), to(white));
            }
            nav {
                background-color: lightblue;
                padding: 10px;
                text-align: center;
                border: 2px solid navy;
            }

            nav a {
                color: navy;
                text-decoration: none;
                font-weight: bold;
                margin: 10px;
            }

            nav a:hover {
                color: red;
                text-decoration: underline;
            }
        </style>
    </head>

    <body>
        <nav>
        <a href="Ejemplo_7.html">← Anterior</a> | 
        <a href="../index_cap5.html">Menú del Capítulo 5</a> | 
        <a href="Ejemplo_9.html">Siguiente →</a>
        </nav>
        <hr>

        <h3>Ejemplo 5.8</h3>

            alt="Portada del libro Java How to Program">

            alt="Portada del libro Java How to Program">
    </body>
</html>
