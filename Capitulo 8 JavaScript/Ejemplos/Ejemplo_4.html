<!DOCTYPE html>
<!-- Cálculo del interés compuesto por un ciclo for -->
<html>
    <head>
    <meta charset="utf-8">
    <title>C&aacute;lculo del inter&eacute;s compuesto</title>
    <style type="text/css">
        table { width: 300px;
                border-collapse: collapse;
                background-color: lightblue; }
        table, td, th { border: 1px solid black;
                        padding: 4px; }
        th      { text-align: lefft;
                    color: white;
                    background-color: darkblue; }
        tr.filaimpar { background-color: white; }
    </style>
    <script>

        var monto; // monto actual del dinero
        var principal  = 1000.00; // monto principal
        var tasa = 0.05; // tasa de interés

        document.writeln( "<table>" ); // comenzar la tabla
        document.writeln(
            "<caption>Cálculo del interés compuesto</caption>" );
        document.writeln(
            "<thead><tr><th>A&ntilde;o</th>" ); // encabezado de la columna del año
        document.writeln(
            "<th>Monto en dep&oacute;sito</th>" ); // encabezado de la columna del monto
        document.writeln( "</tr></thead><tbody>" );

        // imprimir una fila de la tabla para cada año
        for ( var anio = 1; anio <= 10; ++anio )
        {
            monto = principal * Math.pow( 1.0 + tasa, anio );
            
            if ( anio % 2 !== 0 )
                document.writeln( "<tr class=filaimpar'><td>" + anio +
                "</td><td>" + monto.toFixed(2) + "</td></tr>" );
            else
            document.writeln( "<tr><td>" + anio +
                "</td><td>" + monto.toFixed(2) + "</td></tr>" );
        } // fin del for

        document.writeln( "</tbody></table>" );
    </script>

    <style type="text/css">
            nav {
                background-color: lightblue;
                padding: 10px;
                text-align: center;
                border: 2px solid navy;
            }

            nav a {
                color: navy;
                text-decoration: none;
                font-weight: bold;
                margin: 10px;
            }

            nav a:hover {
                color: red;
                text-decoration: underline;
            }
        </style>

    </head>

        <script type="text/javascript">
            document.writeln(
                '<nav>' +
                '<a href="Ejemplo_3.html">← Anterior</a> | ' +
                '<a href="../index_cap8.html">Menú del Capítulo 8</a> | ' +
                '<a href="Ejemplo_5.html">Siguiente →</a>' +
                '</nav>' +
                '<hr>'
            );
        </script>
    </body>
</html>
