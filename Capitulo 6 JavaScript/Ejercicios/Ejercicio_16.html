<!DOCTYPE html>
<!-- Ejercicio 6.16 -->
<html>
    <head>
        <meta charset="utf-8">
        <title>6.16 </title>

        <script type="text/javascript">
            var primerNumero;
            var segundoNumero;
            var numero1;
            var numero2;
            var suma;
            var producto;
            var diferencia;
            var cociente;

            primerNumero = window.prompt("Escriba el primer número");
            segundoNumero = window.prompt("Escriba el segundo número");

            numero1 = parseInt(primerNumero);
            numero2 = parseInt(segundoNumero);

            suma = numero1 + numero2;
            producto = numero1 * numero2;
            diferencia = numero1 - numero2;
            cociente = numero1 / numero2;

            document.writeln("<h1>Resultados de las operaciones</h1>");
            document.writeln("<p>La suma es: " + suma + "</p>");
            document.writeln("<p>El producto es: " + producto + "</p>");
            document.writeln("<p>La diferencia es: " + diferencia + "</p>");
            document.writeln("<p>El cociente es: " + cociente + "</p>");
        </script>
