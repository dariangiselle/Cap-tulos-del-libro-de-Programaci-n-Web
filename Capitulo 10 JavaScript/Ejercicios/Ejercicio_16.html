<!DOCTYPE html>
<!-- Ejercicio 10. 16 -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Ejercicio 10.16</title>
        <script>
            document.writeln("<h1>Ejercicio 10.16 La criba de Eratóstenes</h1>");

            var primos = new Array( 1000 );
            for ( var i = 0; i < primos.length; ++i )
            {
                primos[ i ] = 1;
            }

            primos[ 0 ] = 0;
            primos[ 1 ] = 0;

            for ( i = 2; i < primos.length; ++i )
            {
                if ( primos[ i ] == 1 )
                {
                    for ( var j = i + i; j < primos.length; j += i )
                    {
                        primos[ j ] = 0;
                    }
                }
            }

            // los índices que siguen en 1 son los números primos
            var lista = [];
            for ( i = 1; i < primos.length; ++i )
            {
                if ( primos[ i ] == 1 )
                {
                    lista.push( i );
                }
            }

            document.writeln("<p>Números primos entre 1 y 999 (se ignora el elemento 0 del arreglo):</p>");
            document.writeln("<p><b>" + lista.join( ", " ) + "</b></p>");
            document.writeln("<p>Se encontraron <strong>" + lista.length + "</strong> números primos.</p>");
        </script>
