<!DOCTYPE html>
<!-- Trazo de texto en CSS3. -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Trazo de texto</title>
        <style type="text/css">
            h1
            {
                color: lightcyan;
                -webkit-text-stroke: 2px black; /* prefijo de proveedor */
                font-size: 500%; /* aumenta el tamaño de la fuente */
            }
            nav {
                background-color: lightblue;
                padding: 10px;
                text-align: center;
                border: 2px solid navy;
            }

            nav a {
                color: navy;
                text-decoration: none;
                font-weight: bold;
                margin: 10px;
            }

            nav a:hover {
                color: red;
                text-decoration: underline;
            }
        </style>
    </head>
