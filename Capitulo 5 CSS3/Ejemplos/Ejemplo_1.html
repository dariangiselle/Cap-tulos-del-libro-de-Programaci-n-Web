<!DOCTYPE html>
<!-- Sombra de texto en CSS3. -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Sombra de texto</title>
        <style type="text/css">
            h1 {
                text-shadow: -4px 4px 6px dimgrey; /* agrega sombra */
                font-size: 400%; /* aumenta el tamaño de la fuente */
            }
            nav {
                background-color: lightblue;
                padding: 10px;
                text-align: center;
                border: 2px solid navy;
            }

            nav a {
                color: navy;
                text-decoration: none;
                font-weight: bold;
                margin: 10px;
            }

            nav a:hover {
                color: red;
                text-decoration: underline;
            }
        </style>
    </head>
