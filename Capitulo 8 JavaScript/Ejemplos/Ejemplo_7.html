<!DOCTYPE html>
<!-- Uso de la instrucción break en una instrucción for. -->
<html>
    <head>
    <meta charset="utf-8">
    <title>Uso de la instrucción break en una instrucción for</title>
    <script>

        for ( var cuenta = 1; cuenta <= 10; ++cuenta )
        {
            if ( cuenta == 5 )
                break;

            document.writeln( cuenta + " " );
        } //fin de for

        document.writeln(
            "<p>Se interrumpió el ciclo en cuenta = " + cuenta + "</p>" );
            
    </script>

    <style type="text/css">
            nav {
                background-color: lightblue;
                padding: 10px;
                text-align: center;
                border: 2px solid navy;
            }

            nav a {
                color: navy;
                text-decoration: none;
                font-weight: bold;
                margin: 10px;
            }

            nav a:hover {
                color: red;
                text-decoration: underline;
            }
        </style>

    </head>

    <body>
        <script type="text/javascript">
            document.writeln(
                '<nav>' +
                '<a href="Ejemplo_6.html">← Anterior</a> | ' +
                '<a href="../index_cap8.html">Menú del Capítulo 8</a> | ' +
                '<a href="Ejemplo_8.html">Siguiente →</a>' +
                '</nav>' +
                '<hr>'
            );
        </script>
    </body>
</html>
