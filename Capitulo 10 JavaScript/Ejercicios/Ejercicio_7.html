<!-- Ejercicio 10. 7 -->

        <meta charset="utf-8">
        <title>Ejercicio 10.7</title>

        <script type="text/javascript">
            document.writeln( "<h1>Ejercicio 10.7</h1>" );
            document.writeln( "<p style=\"color: #2c3e50;\"><b>Indique si cada uno de los siguientes enunciados es verdadero o falso. Si es falso, explique por qué.</b></p>" );

            // Inciso a
            document.writeln( "<p><b>a) Para hacer referencia a una ubicación o elemento específico en un arreglo, especificamos el nombre del arreglo y el valor del elemento.</b><br>" );
            document.writeln( "<b>Respuesta:</b> <strong style=\"color: #e74c3c;\">Falso</strong>. <b>¿Por qué?</b> Para hacer referencia a un elemento específico se especifica el nombre del arreglo y el índice de la ubicación, no el valor que contiene el elemento.</p>" );

            // Inciso b
            document.writeln( "<p><b>b) La declaración de una variable reserva espacio para un arreglo.</b><br>" );
            document.writeln( "<b>Respuesta:</b> <strong style=\"color: #e74c3c;\">Falso</strong>. <b>¿Por qué?</b> La declaración de una variable por sí sola no crea ni reserva espacio para un arreglo en memoria.</p>" );

            // Inciso c
            document.writeln( "<p><b>c) Para indicar que deben reservarse 100 ubicaciones para el arreglo entero p, el programador debe escribir la siguiente declaración: p[ 100 ];</b><br>" );
            document.writeln( "<b>Respuesta:</b> <strong style=\"color: #e74c3c;\">Falso</strong>. <b>¿Por qué?</b> Escribir p[ 100 ]; es como un elemento específico en este caso el indice 100. Para crear y reservar el espacio para 100 ubicaciones se debe escribir var p = new Array( 100 ); o var p = [ ];.</p>" );

            // Inciso d
            document.writeln( "<p><b>d) Un programa de JavaScript que inicializa los elementos de un arreglo de 15 elementos en cero debe contener cuando menos una instrucción for.</b><br>" );
            document.writeln( "<b>Respuesta:</b> <strong style=\"color: #e74c3c;\">Falso</strong>. <b>¿Por qué?</b> Aunque el ciclo for es muy común, no es obligatorio porque se puede inicializar el arreglo directamente usando un arreglo literal con ceros o utilizando métodos como fill().</p>" );

            // Inciso e
            document.writeln( "<p><b>e) Un programa de JavaScript que calcula el total de los elementos de un arreglo bidimensional debe contener instrucciones for anidadas.</b><br>" );
            document.writeln( "<b>Respuesta:</b> <strong style=\"color: #27ae60;\">Verdadero</strong></p>" );
        </script>
