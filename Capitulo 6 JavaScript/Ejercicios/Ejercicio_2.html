        <script type="text/javascript">

            // Respuestas del ejercicio 6.2

            document.writeln("<h1>Ejercicio 6.2</h1>");

            document.writeln("<h2>Indique si cada uno de los ejercicios es verdadero o falso. Si es falso, explique por qué.</h2>");

            document.writeln("<p><b>a) <span class='respuesta'>Los comentarios hacen que la computadora imprima el texto después de los caracteres // en la pantalla al momento de ejecutar la secuencia de comandos.</span></b> Falso. Los comentarios que comienzan con // no se imprimen en la pantalla. Sirven para escribir explicaciones en el codigo.</p>");

            document.writeln("<p><b>b) <span class='respuesta'>JavaScript considera que las variables numeros y NuMeRo son idénticas.</span></b> Falso. JavaScript distingue entre mayusculas y minusculas, por eso las variables numero y NuMeRo no son identicas.</p>");

            document.writeln("<p><b>c) <span class='respuesta'>El operador rediduo (%) puede usarse dólo con operandos numéricos.</span></b> Verdadero. El operador residuo (%) se utiliza con operandos numericos para obtener el residuo de una division.</p>");

            document.writeln("<p><b>d) <span class='respuesta'>Los operadores aritméticos *, /, %, + y - tienen todos el mismo nivel de precedencia. </span></b>Falso. Los operadores *, / y % tienen mayor precedencia que los operadores + y -.</p>");

            document.writeln("<p><b>e) <span class='respuesta'>El método parseInt convierte un entero en una cadena.</span></b> Falso. El metodo parseInt convierte una cadena que representa un numero en un valor entero, no un entero en una cadena.</p>");

        </script>
