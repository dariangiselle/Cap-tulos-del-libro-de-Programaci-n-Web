        <h1>Ejercicio 6.14</h1>
        <h2>Orden de evaluación de operadores</h2>

        <script type="text/javascript">
            var x;

            document.writeln("<h3>Inciso a)</h3>");
            document.writeln("<p>x = 7 + 3 * 6 / 2 - 1</p>");

            x = 7 + 3 * 6 / 2 - 1;

            document.writeln("<p>Orden: 3 * 6 = 18, 18 / 2 = 9, 7 + 9 = 16, 16 - 1 = 15</p>");
            document.writeln("<p>El valor de x es: " + x + "</p>");

            document.writeln("<h3>Inciso b)</h3>");
            document.writeln("<p>x = 2 % 2 + 2 * 2 - 2 / 2</p>");

            x = 2 % 2 + 2 * 2 - 2 / 2;

            document.writeln("<p>Orden: 2 % 2 = 0, 2 * 2 = 4, 2 / 2 = 1, 0 + 4 = 4, 4 - 1 = 3</p>");
            document.writeln("<p>El valor de x es: " + x + "</p>");

            document.writeln("<h3>Inciso c)</h3>");
            document.writeln("<p>x = (3 * 9 * (3 + (9 * 3 / (3))))</p>");

            x = (3 * 9 * (3 + (9 * 3 / (3))));

            document.writeln("<p>Orden: 9 * 3 = 27, 27 / 3 = 9, 3 + 9 = 12, 3 * 9 = 27, 27 * 12 = 324</p>");
            document.writeln("<p>El valor de x es: " + x + "</p>");
        </script>
