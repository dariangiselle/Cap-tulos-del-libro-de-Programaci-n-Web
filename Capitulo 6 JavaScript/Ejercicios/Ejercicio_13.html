        <h1>Ejercicio 6.13</h1>
        <h2>Ecuación: y = ax³ + 7</h2>

        <script type="text/javascript">
            document.writeln("<p>a) y = a * x * x * x + 7; Correcta</p>");
            document.writeln("<p>b) y = a * x * x * (x + 7); Incorrecta</p>");
            document.writeln("<p>c) y = (a * x) * x * (x + 7); Incorrecta</p>");
            document.writeln("<p>d) y = (a * x) * x * x + 7; Correcta</p>");
            document.writeln("<p>e) y = a * (x * x * x) + 7; Correcta</p>");
            document.writeln("<p>f) y = a * x * (x * x + 7); Incorrecta</p>");
        </script>
