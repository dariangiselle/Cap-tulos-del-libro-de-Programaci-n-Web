<!DOCTYPE html>
<!-- Uso de la instrucción de repetición do...while. -->
<html>
    <head>
    <meta charset="utf-8">
    <title>Uso de la instrucción de repeticion do...while</title>
    <script>

        var contador = 1;

        do {
            document.writeln( "<h" + contador + ">Este es " +
                "un encabezado de nivel h" + contador + "</h>" +
                contador + ">" );
            ++contador;
        } while ( contador <= 6 );
    </script>

    <style type="text/css">
            nav {
                background-color: lightblue;
                padding: 10px;
                text-align: center;
                border: 2px solid navy;
            }

            nav a {
                color: navy;
                text-decoration: none;
                font-weight: bold;
                margin: 10px;
            }

            nav a:hover {
                color: red;
                text-decoration: underline;
            }
        </style>

    </head>

    <body>
        <script type="text/javascript">
            document.writeln(
                '<nav>' +
                '<a href="Ejemplo_6.html">← Anterior</a> | ' +
                '<a href="../index_cap8.html">Menú del Capítulo 8</a> | ' +
                '<a href="Ejemplo_7.html">Siguiente →</a>' +
                '</nav>' +
                '<hr>'
            );
        </script>
    </body>
</html>
