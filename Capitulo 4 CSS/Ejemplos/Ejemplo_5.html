<!DOCTYPE html>
<!-- Posicionamiento absoluto de los elementos -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Posicionamiento absoluto</title>
        <style type="text/css">
            .imagen_fondo    { position: absolute;
                              top: 0px;
                              left: 0px;
                              z-index: 1; }
            .imagen_primerplano  { position: absolute;
                            top: 25px;
                            left: 100px;
                            z-index: 2; }
            .texto       { position: absolute;
                        top: 25px;
                        left: 100px;
                        z-index: 3;
                        font-size: 20pt;
                        font-family: tahoma, geneva, sans-serif; }
        </style>
    </head>
    <body>
        <nav>
        <a href="Ejemplo_4.html">← Anterior</a> | 
        <a href="../index_cap4.html">Menú del Capítulo 3</a> | 
        <a href="Ejemplo_6.html">Siguiente →</a>
        </nav>
        <hr>
    
        <p><img src="imagen_ejemplo5/imagen_fondo.png" class="imagen_fondo"
            alt="Primera imagen posicionada" /></p>
        
        <p><img src="imagen_ejemplo5/imagen_primerplano.png" class="imagen_primerplano"
            alt="Segunda imagen posicionada" /></p>

        <p class="texto">Texto posicionado</p>
    </body>
</html>
