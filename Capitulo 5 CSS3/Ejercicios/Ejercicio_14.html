<!DOCTYPE html>
<!-- Ejercicio 5.14 -->
<html>
    <head>
        <meta charset="utf-8">
        <title>5.14 Trasnformación con :hover</title>
        <style type="text/css">
            .imagenes
            {
                display: flex;
                gap: 20px;
            }

            .imagenes img
            {
                width: 150px;
                transition: transform 1s;
            }

            .imagenes img:hover
            {
                transform: scale(1.2);
            }
            nav {
                background-color: lightblue;
                padding: 10px;
                text-align: center;
                border: 2px solid navy;
            }

            nav a {
                color: navy;
                text-decoration: none;
                font-weight: bold;
                margin: 10px;
            }

            nav a:hover {
                color: red;
                text-decoration: underline;
            }
        </style>
    </head>

    <body>
