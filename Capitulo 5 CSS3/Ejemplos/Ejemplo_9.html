<!DOCTYPE html>
<!-- Estirar y repetir una imagen para crear un borde. -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Borde de imagen</title>
        <style type="text/css">
            div
            {
                border-style: solid;
                border-width: 30px;
                width: 234px;
                padding: 20px 20px;
            }
            #stretch
            {
                -webkit-border-image: url(imagen_ejemplo9/borde.png) 80 80 80 80 stretch;
                -moz-border-image: url(imagen_ejemplo9/borde.png) 80 80 80 80 stretch;
                -o-border-image: url(imagen_ejemplo9/borde.png) 80 80 80 80 stretch;
                border-image: url(imagen_ejemplo9/borde.png) 80 80 80 80 stretch; 
            }
            #repeat
            {
                -webkit-border-image: url(imagen_ejemplo9/borde.png) 34% 34% repeat;
                -moz-border-image: url(imagen_ejemplo9/borde.png) 34% 34% repeat;
                -o-border-image: url(imagen_ejemplo9/borde.png) 34% 34% repeat;
                border-image: url(imagen_ejemplo9/borde.png) 34% 34% repeat;
            }
            nav {
                background-color: lightblue;
                padding: 10px;
                text-align: center;
                border: 2px solid navy;
            }

            nav a {
                color: navy;
                text-decoration: none;
                font-weight: bold;
                margin: 10px;
            }

            nav a:hover {
                color: red;
                text-decoration: underline;
            }
        </style>
    </head>

    <body>
        <nav>
        <a href="Ejemplo_8.html">← Anterior</a> | 
        <a href="../index_cap5.html">Menú del Capítulo 5</a> | 
        <a href="Ejemplo_10.html">Siguiente →</a>
        </nav>
        <hr>

        <h3>Ejemplo 5.9</h3>

        <h2>Bordes de imagen</h2>
        <img src="imagen_ejemplo9/borde.png" alt="imagen utilizada para demostrar los bordes">
        <p><div id="stretch">Se estira el borde de la imagen</div></p>
        <p><div id="repeat">Se repite el borde de la imagen</div></p>
    </body>
</html>
