<!DOCTYPE html>
<!-- Repetición controlada por contador con la instrucción for. -->
<html>
    <head>
    <meta charset="utf-8">
    <title>Repetición controlada por contador</title>
    <script>

        // La inicialización, condición de repetición e
        // incremento se incluyen en el encabezado de 
        // la instrucción for.
        for ( var contador = 1; contador <= 7; ++contador )
            document.writeln( "<p style = 'font-size: " +
                contador + "ex'>Tamaño de fuente de HTML5 " + contador + "ex</p>" );

    </script>

    <style type="text/css">
            nav {
                background-color: lightblue;
                padding: 10px;
                text-align: center;
                border: 2px solid navy;
            }

            nav a {
                color: navy;
                text-decoration: none;
                font-weight: bold;
                margin: 10px;
            }

            nav a:hover {
                color: red;
                text-decoration: underline;
            }
        </style>

    </head>
    
    <body>
        <script type="text/javascript">
            document.writeln(
                '<nav>' +
                '<a href="Ejemplo_1.html">← Anterior</a> | ' +
                '<a href="../index_cap8.html">Menú del Capítulo 8</a> | ' +
                '<a href="Ejemplo_3.html">Siguiente →</a>' +
                '</nav>' +
                '<hr>'
            );
        </script>
    </body>
</html>
