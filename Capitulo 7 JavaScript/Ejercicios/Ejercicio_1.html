        <script>
            document.writeln("<h1>Ejercicio 7.1</h1>");
            document.writeln("<h2>Complete los siguientes enunciados</h2>");

            document.writeln("<p><b>a)</b> Todas las secuencias de comandos pueden escribirse en términos de tres tipos de estructuras de control: <b>secuencia, selección y repetición.</b></p>");

            document.writeln("<p><b>b)</b> La instrucción de selección doble <b>if...else</b> se utiliza para ejecutar una acción cuando una condición es verdadera, y otra acción cuando esa condición es falsa.</p>");

            document.writeln("<p><b>c)</b> Al proceso de repetir un conjunto de instrucciones un número específico de veces se le llama repetición <b>controlada por contador.</b></p>");

            document.writeln("<p><b>d)</b> Cuando no se sabe de antemano cuántas veces se repetirá un conjunto de instrucciones, se puede usar un valor <b>centinela</b> (o un <b>valor de señal, valor de prueba o valor de bandera</b>) para terminar la repetición.</p>");
        </script>
