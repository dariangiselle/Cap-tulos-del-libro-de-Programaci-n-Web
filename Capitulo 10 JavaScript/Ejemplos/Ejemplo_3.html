<!DOCTYPE html>
<!-- Documento de HTML5 que muestra la suma de los elementos de un arreglo. -->
<html>
    <head>
        <meta charset="utf-8">
        <title>Suma de los elementos de un arreglo</title>
        <script src = "js/SumaArreglo.js"></script>

        <style type="text/css">
            nav {
                background-color: lightblue;
                padding: 10px;
                text-align: center;
                border: 2px solid navy;
            }

            nav a {
                color: navy;
                text-decoration: none;
                font-weight: bold;
                margin: 10px;
            }

            nav a:hover {
                color: red;
                text-decoration: underline;
            }
        </style>

    </head>

    <body>

        <div id = "salida"></div>

        <script type="text/javascript">
            document.writeln(
                '<nav>' +
                '<a href="Ejemplo_2.html">← Anterior</a> | ' +

                '<a href="Ejemplo_4.html">Siguiente →</a>' +
                '</nav>' +
                '<hr>'
            );
        </script>

    </body>
</html>
