        <script type="text/javascript">
            document.writeln( "<h1>Ejercicio 11.1</h1>" );
            document.writeln( "<p style=\"color: #2c3e50;\"><b>Complete las siguientes oraciones:</b></p>" );

            document.writeln( "<p><b>a)</b> Como JavaScript usa objetos para realizar muchas tareas, se conoce por lo común como <strong style=\"color: #2980b9;\">lenguaje de programación basado en objetos</strong>.</p>" );
            document.writeln( "<p><b>b)</b> Todos los objetos tienen <strong style=\"color: #e74c3c;\">atributos</strong> y exhiben <strong style=\"color: #27ae60;\">comportamientos</strong>.</p>" );
            document.writeln( "<p><b>c)</b> Los métodos del objeto <strong style=\"color: #8e44ad;\">Math</strong> nos permiten realizar muchos cálculos matemáticos comunes.</p>" );
            document.writeln( "<p><b>d)</b> Al proceso de invocar (o llamar) al método de un objeto se le conoce como <strong style=\"color: #d35400;\">enviar un mensaje al objeto</strong>.</p>" );
            document.writeln( "<p><b>e)</b> Las literales de cadena o constantes de cadena se escriben como una secuencia de caracteres en <strong style=\"color: #16a085;\">comillas dobles</strong> o <strong style=\"color: #2980b9;\">comillas sencillas</strong>.</p>" );
            document.writeln( "<p><b>f)</b> Los índices para los caracteres en una cadena empiezan en <strong style=\"color: #c0392b;\">0</strong>.</p>" );
            document.writeln( "<p><b>g)</b> Los métodos <strong style=\"color: #27ae60;\">indexOf</strong> y <strong style=\"color: #27ae60;\">lastIndexOf</strong> de String buscan la primera y última ocurrencias de una subcadena en un objeto String, respectivamente.</p>" );
            document.writeln( "<p><b>h)</b> Al proceso de dividir una cadena en tokens se le denomina <strong style=\"color: #8e44ad;\">tokenización</strong>.</p>" );
            document.writeln( "<p><b>i)</b> El procesamiento de fechas y horas puede realizarse con base en la <strong style=\"color: #d35400;\">zona horaria local de la computadora</strong> o en el <strong style=\"color: #2980b9;\">Tiempo Universal Coordinado (UTC)</strong> del Estándar de Tiempo Mundial.</p>" );
            document.writeln( "<p><b>j)</b> El método <strong style=\"color: #16a085;\">parse</strong> de Date recibe como argumento una cadena que representa una fecha y hora, y devuelve el número de milisegundos transcurridos entre la medianoche del 1 de enero de 1970 y la fecha y hora especificadas.</p>" );
            document.writeln( "<p><b>k)</b> Las aplicaciones Web pueden usar la propiedad <strong style=\"color: #c0392b;\">localStorage</strong> del objeto window para almacenar hasta varios megabytes de datos de cadenas de pares clave/valor en la computadora del usuario y pueden acceder a estos datos a través de sesiones y pestañas del navegador.</p>" );
            document.writeln( "<p><b>l)</b> Las aplicaciones Web que necesitan acceso a los datos de pares clave/valor para sólo una sesión de navegación y que deben mantener esos datos separados entre varias pestañas pueden usar la propiedad <strong style=\"color: #27ae60;\">sessionStorage</strong> del objeto window.</p>" );
            document.writeln( "<p><b>m)</b> Un selector <strong style=\"color: #8e44ad;\">:first-child</strong> de CSS3 selecciona el primer hijo de un elemento.</p>" );
            document.writeln( "<p><b>n)</b> Un selector <strong style=\"color: #d35400;\">:nth-child</strong> de CSS3 con el argumento \"odd\" selecciona los elementos hijos impares y uno con el argumento \"even\" selecciona los elementos hijos pares.</p>" );
        </script>
