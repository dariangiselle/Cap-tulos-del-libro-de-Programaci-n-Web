<!DOCTYPE html>
<!-- Ejercicio 7. 12 -->
<html>
    <head>
        <meta charset="utf-8">
        <title>7. 12</title>

        <script type="text/javascript">
            var numeroCuenta;
            var saldoInicial;
            var cargos;
            var creditos;
            var limiteCredito;
            var nuevoSaldo;

            // Solicitar los datos del cliente
            numeroCuenta = parseInt(prompt("Introduzca el número de cuenta:"));

            saldoInicial = parseInt(prompt("Introduzca el saldo inicial:"));

            cargos = parseInt(prompt("Introduzca el total de cargos del mes:"));

            creditos = parseInt(prompt("Introduzca el total de créditos del mes:"));

            limiteCredito = parseInt(prompt("Introduzca el límite de crédito:"));

            // Calcular el nuevo saldo
            nuevoSaldo = saldoInicial + cargos - creditos;

            // Mostrar el número de cuenta y el nuevo saldo
            document.writeln("<h1>Estado de cuenta</h1>");
            document.writeln("<p>Número de cuenta: " + numeroCuenta + "</p>");
            document.writeln("<p>Nuevo saldo: " + nuevoSaldo + "</p>");

            // Comprobar si se excedió el límite de crédito
            if ( nuevoSaldo > limiteCredito )
            {
                document.writeln("<p>Se excedió el límite de su crédito</p>");
            }
        </script>
