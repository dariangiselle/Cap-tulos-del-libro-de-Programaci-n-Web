        <h2 style="text-align: center;">Tabla de Cuadrados y Cubos (0 al 5)</h2>

        <script>
            document.writeln("<table>");
            document.writeln("  <thead>");
            document.writeln("    <tr>");
            document.writeln("      <th>número</th>");
            document.writeln("      <th>cuadrado</th>");
            document.writeln("      <th>cubo</th>");
            document.writeln("    </tr>");
            document.writeln("  </thead>");
            document.writeln("  <tbody>");

            for (var i = 0; i <= 5; i++) {
                var cuadrado = i * i;
                var cubo = i * i * i;

                document.writeln("    <tr>");
                document.writeln("      <td>" + i + "</td>");
                document.writeln("      <td>" + cuadrado + "</td>");
                document.writeln("      <td>" + cubo + "</td>");
                document.writeln("    </tr>");
            }

            document.writeln("  </tbody>");
            document.writeln("</table>");
        </script>
    </body>
