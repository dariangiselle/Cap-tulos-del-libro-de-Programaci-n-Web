        <title>6.17 </title>

        <script type="text/javascript">
            var numero1;
            var numero2;

            numero1 = window.prompt("Escriba el primer número entero");
            numero2 = window.prompt("Escriba el segundo número entero");

            numero1 = parseInt(numero1);
            numero2 = parseInt(numero2);

            if (numero1 > numero2)
                window.alert(numero1 + " es mayor que " + numero2);

            else
                if (numero2 > numero1)
                    window.alert(numero2 + " es mayor que " + numero1);

                else
                    document.writeln("<h1>Estos números son iguales</h1>");
        </script>
