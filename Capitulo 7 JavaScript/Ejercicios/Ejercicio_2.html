        <script>
            document.writeln("<h1>Ejercicio 7.2</h1>");
            document.writeln("<p>Escriba cuatro instrucciones de JavaScript que sumen 1, cada una a la variable x, que contiene un número.</p>");

            document.writeln("<h2>Respuestas</h2>");

            document.writeln("<p>1. x = x + 1;</p>");
            document.writeln("<p>2. x++;</p>");
            document.writeln("<p>3. x += 1;</p>");
            document.writeln("<p>4. ++x;</p>");
            
        </script>
