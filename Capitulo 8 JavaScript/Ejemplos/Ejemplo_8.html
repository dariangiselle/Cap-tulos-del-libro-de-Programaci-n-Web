<!DOCTYPE html>
<!-- Uso de la instrucción continue en una instrucción for. -->
<html>
    <head>
    <meta charset="utf-8">
    <title>Uso de la instrucción continue en una instrucción for</title>
    <script>

        for ( var cuenta = 1; cuenta <= 10; ++cuenta )
        {
            if ( cuenta == 5 )
                continue; // omite el resto del código del ciclo sólo si cuenta == 5

            document.writeln( cuenta + " ");
            
        } //fin de for
        document.writeln( "<p>Se usó continue para no imprimir el 5</p>" );
    </script>

    <style type="text/css">
            nav {
                background-color: lightblue;
                padding: 10px;
                text-align: center;
                border: 2px solid navy;
            }

            nav a {
                color: navy;
                text-decoration: none;
                font-weight: bold;
                margin: 10px;
            }

            nav a:hover {
                color: red;
                text-decoration: underline;
            }
        </style>

    </head>

    <body>
        <script type="text/javascript">
            document.writeln(
                '<nav>' +
                '<a href="Ejemplo_7.html">← Anterior</a> | ' +
                '<a href="../index_cap8.html">Menú del Capítulo 8</a> | ' +
                '<a href="Ejemplo_1.html">Siguiente →</a>' +
                '</nav>' +
                '<hr>'
            );
        </script>
    </body>
</html>
